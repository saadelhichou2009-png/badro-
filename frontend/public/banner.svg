<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- شبكة خلفية خفيفة -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Equity curve تجريبي -->
  <path d="M 0 230 L 100 210 L 200 220 L 300 180 L 400 190 L 500 150 L 600 165 L 700 120 L 800 135 L 900 90 L 1000 100 L 1100 60 L 1200 70 L 1200 300 L 0 300 Z" fill="url(#areaGrad)"/>
  <path d="M 0 230 L 100 210 L 200 220 L 300 180 L 400 190 L 500 150 L 600 165 L 700 120 L 800 135 L 900 90 L 1000 100 L 1100 60 L 1200 70" fill="none" stroke="url(#lineGrad)" stroke-width="3"/>

  <!-- نبضة (Pulse) -->
  <circle cx="1100" cy="60" r="6" fill="#16a34a">
    <animate attributeName="r" values="5;10;5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- الشعار النصي -->
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">TradePulse</text>
  <text x="60" y="145" font-family="Arial, sans-serif" font-size="20" fill="#93c5fd">Trading Analytics Platform</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="22" fill="#e2e8f0">منصة تحليل حسابات التداول — MT4 / MT5</text>
</svg>
