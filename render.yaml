services:
  - type: web
    name: tradepulse-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # تُضاف يدوياً من لوحة Render بعد ربط قاعدة Neon
      - key: REDIS_URL
        sync: false # تُضاف يدوياً بعد إنشاء قاعدة Upstash (اختياري)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # رابط موقع Netlify، مثال: https://your-site.netlify.app
      - key: CORS_ORIGINS
        sync: false # نفس رابط Netlify
